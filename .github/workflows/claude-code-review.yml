name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See claude.yml: this repository is public, and the action does not read the
          # user-scope settings file that suppresses attribution on a developer machine.
          # The default permission mode denies what `--allowed-tools` leaves out; the auto
          # mode the action otherwise picks would leave it to a classifier, while the bot
          # reads pull-request text anyone can write.
          settings: '{"attribution":{"commit":"","pr":"","sessionUrl":false},"permissions":{"defaultMode":"default"}}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read the change with `gh pr diff ${{ github.event.pull_request.number }}`. The checkout is
            the merge commit, so its files are the whole repository, not this pull request.

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the `mcp__github_inline_comment__create_inline_comment` tool to leave inline review comments on specific lines where appropriate, and post a summary comment on the PR.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
