nodeLinker: hoisted
linkWorkspacePackages: true
# A worktree's node_modules links into the primary checkout's (packages/worktree-setup), and
# pnpm reads that mirror as uninstalled: the default (`install`) would install before the first
# `pnpm run` or `pnpm exec` there, writing through the links into the primary's packages.
# Install explicitly instead.
verifyDepsBeforeRun: false
packages:
  - "packages/**"
allowBuilds:
  esbuild: true
  # nx persists only as a transitive dependency of lerna (used internally for its
  # project graph); we no longer use nx for build orchestration (build = pnpm -r).
  nx: true
# Force patched versions of vulnerable transitive dependencies (Dependabot
# alerts) that parents' pinned ranges would otherwise hold back.
overrides:
  'js-yaml@>=4.0.0 <4.2.0': '4.2.0'
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
  'tar@>=7.0.0 <7.5.16': '7.5.16'
  'tmp@0.2.6': '0.2.7'
